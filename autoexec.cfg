// Execute custom viewmodel script
exec viewmoddel.cfg

// Execute custom crosshair script
exec crosshair.cfg

bind "F11" "exec autoexec"

// Single-button practice mode setup (Infinite Warmup, Round Time Fixed & Max Money)
alias "practice_mode" "sv_cheats 1; bot_kick; bot_quota 0; mp_maxmoney 60000; mp_startmoney 60000; mp_afterroundmoney 60000; mp_buytime 9999; mp_buy_anywhere 1; mp_warmup_pausetimer 1; mp_warmuptime 999999; mp_warmup_start; mp_roundtime_defuse 60; mp_freezetime 0; mp_restartgame 1; echo [PRACTICE] Unlimited time, max money & bots kicked!"
bind "F8" "practice_mode"