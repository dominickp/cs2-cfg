// ==========================================================
// J: Cycles Colors (Independent)
// K: Cycles Shapes A through E (Independent)
// Updated with Clean Dot (A) and Compact Tight (D)
// ==========================================================

// ==========================================================
// 1. SHAPE DEFINITIONS
// Edit length, gap, thickness, or outline values below to tweak shapes.
// ==========================================================

// ----------------------------------------------------------
// SHAPE A (Static Circle w/ Outline)
// Specs: Length 3 | Gap 4 | Thickness 1 | Outline 1 | Style 3
// ----------------------------------------------------------
alias "shape_A_p1" "cl_crosshairstyle 3; cl_crosshair_length 3; cl_crosshair_gap 4; cl_crosshair_thickness 1; cl_crosshairdot 0; cl_crosshair_t 0"
alias "shape_A_p2" "cl_crosshair_drawoutline 1; cl_crosshaircolor_a 255; cl_crosshair_recoil 0; cl_crosshair_dynamic_splitdist 6; cl_crosshair_dynamic_splitalpha_innermod 0; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_maxdist_splitratio 1"
alias "shape_A_apply" "shape_A_p1; shape_A_p2"

// ----------------------------------------------------------
// SHAPE B (Large Outlined)
// Specs: Length 6 | Gap 2 | Thickness 2 | Outline 1
// ----------------------------------------------------------
alias "shape_B_p1" "cl_crosshairstyle 4; cl_crosshair_length 6; cl_crosshair_gap 2; cl_crosshair_thickness 2; cl_crosshairdot 0; cl_crosshair_t 0"
alias "shape_B_p2" "cl_crosshair_drawoutline 1; cl_crosshaircolor_a 255; cl_crosshair_recoil 0; cl_crosshair_dynamic_splitdist 6; cl_crosshair_dynamic_splitalpha_innermod 0; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_maxdist_splitratio 1"
alias "shape_B_apply" "shape_B_p1; shape_B_p2"

// ----------------------------------------------------------
// SHAPE C (Shot Feedback w/ Outline)
// Specs: Length 4 | Gap 3 | Thickness 2 | Outline 1 | Dot 0 | Style 5
// ----------------------------------------------------------
alias "shape_C_p1" "cl_crosshairstyle 5; cl_crosshair_length 4; cl_crosshair_gap 3; cl_crosshair_thickness 2; cl_crosshairdot 0; cl_crosshair_t 0"
alias "shape_C_p2" "cl_crosshair_drawoutline 1; cl_crosshaircolor_a 255; cl_crosshair_recoil 0; cl_crosshair_dynamic_splitdist 9; cl_crosshair_dynamic_splitalpha_innermod 0; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_maxdist_splitratio 1"
alias "shape_C_apply" "shape_C_p1; shape_C_p2"

// ----------------------------------------------------------
// SHAPE D (Medium Thick)
// Specs: Length 5 | Gap 3 | Thickness 3 | Outline 0
// ----------------------------------------------------------
alias "shape_D_p1" "cl_crosshairstyle 4; cl_crosshair_length 5; cl_crosshair_gap 3; cl_crosshair_thickness 3; cl_crosshairdot 0; cl_crosshair_t 0"
alias "shape_D_p2" "cl_crosshair_drawoutline 0; cl_crosshaircolor_a 255; cl_crosshair_recoil 0; cl_crosshair_dynamic_splitdist 5; cl_crosshair_dynamic_splitalpha_innermod 0; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_maxdist_splitratio 1"
alias "shape_D_apply" "shape_D_p1; shape_D_p2"

// ----------------------------------------------------------
// SHAPE E (Cyan Cross w/ Full Outline)
// Specs: Length 3 | Gap 2 | Thickness 3 | Outline 1 (Full) | Dot Off
// ----------------------------------------------------------
alias "shape_E_p1" "cl_crosshairstyle 4; cl_crosshair_length 3; cl_crosshair_gap 2; cl_crosshair_thickness 3; cl_crosshairdot 0; cl_crosshair_t 0"
alias "shape_E_p2" "cl_crosshair_drawoutline 1; cl_crosshair_recoil 0"
alias "shape_E_apply" "shape_E_p1; shape_E_p2"

// ==========================================================
// 2. COLOR DEFINITIONS (cl_crosshaircolor 5 enables RGB)
// ==========================================================
alias "col_default"  "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 82; cl_crosshaircolor_b 255; echo [COLOR] Default Pink" 
alias "col_ancient"  "cl_crosshaircolor 5; cl_crosshaircolor_r 46; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255; echo [COLOR] Ancient Dark Blue"
alias "col_dust2"    "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 151; cl_crosshaircolor_b 255; echo [COLOR] Dust2 Light Blue"
alias "col_inferno"  "cl_crosshaircolor 5; cl_crosshaircolor_r 50; cl_crosshaircolor_g 250; cl_crosshaircolor_b 50; echo [COLOR] Inferno Green"
alias "col_mirage"   "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; echo [COLOR] Mirage Yellow"
alias "col_nuke"     "cl_crosshaircolor 5; cl_crosshaircolor_r 247; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255; echo [COLOR] Nuke Magenta"
alias "col_overpass" "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 116; cl_crosshaircolor_b 255; echo [COLOR] Overpass Blue"
alias "col_train"    "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 165; cl_crosshaircolor_b 255; echo [COLOR] Train Blue"

// ==========================================================
// 3. COLOR ROTATION LOGIC (J)
// ==========================================================
alias "cycle_color" "color_1"
alias "color_1" "col_ancient;  alias cycle_color color_2"
alias "color_2" "col_dust2;    alias cycle_color color_3"
alias "color_3" "col_inferno;  alias cycle_color color_4"
alias "color_4" "col_mirage;   alias cycle_color color_5"
alias "color_5" "col_nuke;     alias cycle_color color_6"
alias "color_6" "col_overpass; alias cycle_color color_7"
alias "color_7" "col_train;    alias cycle_color color_8"
alias "color_8" "col_default;  alias cycle_color color_1"

// ==========================================================
// 4. SHAPE ROTATION LOGIC (K)
// ==========================================================
alias "cycle_shape" "shape_B_set"

alias "shape_A_set" "shape_A_apply; alias cycle_shape shape_B_set; echo [SHAPE] Shape A (Clean Center Dot)" 
alias "shape_B_set" "shape_B_apply; alias cycle_shape shape_C_set; echo [SHAPE] Shape B (Medium Standard)" 
alias "shape_C_set" "shape_C_apply; alias cycle_shape shape_D_set; echo [SHAPE] Shape C (Large Wide Gap)" 
alias "shape_D_set" "shape_D_apply; alias cycle_shape shape_E_set; echo [SHAPE] Shape D (Compact Tight)" 
alias "shape_E_set" "shape_E_apply; alias cycle_shape shape_A_set; echo [SHAPE] Shape E (Half Outline)" 

// ==========================================================
// 5. INITIALIZATION AND BINDS
// ==========================================================
bind "j" "cycle_color"
bind "k" "cycle_shape"

shape_A_apply
col_default

// My default preference
shape_C_set
color_3
