// ==========================================================
// FIXED SCRIPT - COMMAND LENGTH ERROR RESOLVED
// K: Cycles Colors only (Independent)
// J: Cycles 5 Shapes (Independent)
// ==========================================================

// --- 1. SHAPE DEFINITIONS ---
// All shape definitions are stripped of color commands.

// SHAPE A (Original Custom) - Kept as is
alias "shape_A" "cl_crosshairgap -5; cl_crosshair_outlinethickness 0; cl_crosshairalpha 255; cl_crosshair_dynamic_splitdist 0; cl_crosshair_recoil false; cl_fixedcrosshairgap -3.5; cl_crosshair_drawoutline 1; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 0.3; cl_crosshair_dynamic_maxdist_splitratio 0.5; cl_crosshairthickness 0.5; cl_crosshairdot 0; cl_crosshairgap_useweaponvalue 0; cl_crosshairusealpha 1; cl_crosshair_t 0; cl_crosshairstyle 4; cl_crosshairsize 1"

// SHAPE Z (ZywOo) - Split into two aliases due to length
alias "shape_Z_p1" "cl_crosshairalpha 255; cl_crosshair_drawoutline 0; cl_crosshair_dynamic_maxdist_splitratio 0.35; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 0.5"
alias "shape_Z_p2" "cl_crosshair_dynamic_splitdist 7; cl_crosshairgap -2; cl_crosshairgap_useweaponvalue 0; cl_crosshairsize 1; cl_crosshairstyle 4; cl_crosshairthickness 0; cl_crosshair_t 0; cl_fixedcrosshairgap -2; cl_crosshairdot 0"
alias "shape_Z_apply" "shape_Z_p1; shape_Z_p2"

// SHAPE X (Xantares) - Split into two aliases due to length
alias "shape_X_p1" "cl_crosshairalpha 255; cl_crosshair_drawoutline 0; cl_crosshair_dynamic_maxdist_splitratio 0.35; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 0.5; cl_crosshair_dynamic_splitdist 7"
alias "shape_X_p2" "cl_crosshairgap -1; cl_crosshairgap_useweaponvalue 0; cl_crosshairsize 2; cl_crosshairstyle 4; cl_crosshairthickness 1.5; cl_crosshair_t 0; cl_fixedcrosshairgap -1; cl_crosshairdot 0"
alias "shape_X_apply" "shape_X_p1; shape_X_p2"

// SHAPE B (Broky) - Split into two aliases due to length
alias "shape_B_p1" "cl_crosshairalpha 255; cl_crosshair_drawoutline 0; cl_crosshair_dynamic_maxdist_splitratio 0.35; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 0.5; cl_crosshair_dynamic_splitdist 7"
alias "shape_B_p2" "cl_crosshairgap -3; cl_crosshairgap_useweaponvalue 0; cl_crosshairsize 1; cl_crosshairstyle 4; cl_crosshairthickness 0.5; cl_crosshair_t 0; cl_fixedcrosshairgap -3; cl_crosshairdot 0"
alias "shape_B_apply" "shape_B_p1; shape_B_p2"

// SHAPE D (docc) - Split into two aliases due to length
alias "shape_D_p1" "cl_crosshairalpha 255; cl_crosshair_drawoutline 1; cl_crosshair_dynamic_maxdist_splitratio 0.35; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 0.5; cl_crosshair_dynamic_splitdist 7"
alias "shape_D_p2" "cl_crosshairgap -3; cl_crosshairgap_useweaponvalue 0; cl_crosshairsize 1.5; cl_crosshairstyle 4; cl_crosshairthickness 0.5; cl_crosshair_t 0; cl_fixedcrosshairgap -3; cl_crosshairdot 0"
alias "shape_D_apply" "shape_D_p1; shape_D_p2"

// --- 2. COLOR DEFINITIONS (Color commands are safe here) ---
alias "col_default"  "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 82; cl_crosshaircolor_b 255"
alias "col_ancient"  "cl_crosshaircolor 5; cl_crosshaircolor_r 46; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255"
alias "col_dust2"    "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 151; cl_crosshaircolor_b 255"
alias "col_inferno"  "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 166; cl_crosshaircolor_b 255"
alias "col_mirage"   "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 143; cl_crosshaircolor_b 255"
alias "col_nuke"     "cl_crosshaircolor 5; cl_crosshaircolor_r 247; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255"
alias "col_overpass" "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 116; cl_crosshaircolor_b 255"
alias "col_train"    "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 165; cl_crosshaircolor_b 255"


// --- 3. COLOR ROTATION LOGIC (J) ---
alias "cycle_color" "color_1"
alias "color_1" "col_ancient;  alias cycle_color color_2"
alias "color_2" "col_dust2;    alias cycle_color color_3"
alias "color_3" "col_inferno;  alias cycle_color color_4"
alias "color_4" "col_mirage;   alias cycle_color color_5"
alias "color_5" "col_nuke;     alias cycle_color color_6"
alias "color_6" "col_overpass; alias cycle_color color_7"
alias "color_7" "col_train;    alias cycle_color color_8"
alias "color_8" "col_default;  alias cycle_color color_1"

// --- 4. SHAPE ROTATION LOGIC (K) (Now uses the new _apply aliases) ---
// Start at the Zywoo set to cycle from the second shape on first press
alias "cycle_shape" "shape_Z_set"

alias "shape_A_set" "shape_A; alias cycle_shape shape_Z_set" 
alias "shape_Z_set" "shape_Z_apply; alias cycle_shape shape_X_set" 
alias "shape_X_set" "shape_X_apply; alias cycle_shape shape_B_set" 
alias "shape_B_set" "shape_B_apply; alias cycle_shape shape_D_set" 
alias "shape_D_set" "shape_D_apply; alias cycle_shape shape_A_set" 


// --- 5. INITIALIZATION AND BINDS ---
bind "K" "cycle_color"
bind "J" "cycle_shape"

// Apply the starting state: Shape A and Default Color
shape_A
col_default
