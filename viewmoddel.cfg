// --- VIEWMODEL ALIASES ---

// PGDN (Lowest and Most Extreme)
alias "vm_pgdn" "viewmodel_fov 65; viewmodel_presetpos 0; viewmodel_offset_x -2; viewmodel_offset_y 2; viewmodel_offset_z -1; cl_prefer_lefthanded 0"

// PGUP (Highest and Most Extreme)
alias "vm_pgup" "viewmodel_fov 78; viewmodel_presetpos 2; viewmodel_offset_x -2; viewmodel_offset_y 2; viewmodel_offset_z 2; cl_prefer_lefthanded 0"

// HOME (Default Preset - Desktop)
alias "vm_home" "viewmodel_presetpos 1"

// --- KEY BINDS ---
bind "PGDN" "vm_pgdn"
bind "PGUP" "vm_pgup"
bind "HOME" "vm_home"

// Ensures the autoexec configuration is written to the games main config file
// host_writeconfig
